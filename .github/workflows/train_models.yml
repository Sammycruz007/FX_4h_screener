name: Eagle Logic — Train Models

# Fetches fresh FX + macro data, THEN retrains all 5 basket models on
# it. Fully self-sufficient — never assumes daily_predict.yml has run
# recently, since ml/train_models.py itself never fetches data (it
# only reads whatever's already in Supabase Storage).

on:
  schedule:
    # Retrain weekly, on Saturdays specifically (not Sunday): FX
    # markets are closed all weekend, so Saturday is a natural "quiet"
    # day with no fresh candle expected, and by then Friday's final
    # close (the last trading day's candle) has already been fetched
    # by Friday's daily_predict.yml run. Split into its own workflow
    # (separate from the daily fetch/predict pipeline, see
    # daily_predict.yml) per project decision: a manual "give me fresh
    # predictions now" trigger on that workflow should never risk also
    # retraining the models — the two are operationally independent
    # concerns (fetch-and-predict vs. retrain) and can now be
    # triggered separately without coupling one to the other.
    - cron: '0 3 * * 6'
  # Allow manual trigger from GitHub Actions UI — independent from
  # daily_predict.yml's manual trigger. Dispatching THIS workflow
  # retrains models; dispatching daily_predict.yml only fetches data
  # and predicts, never retrains.
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements_cloud.txt"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_cloud.txt

      # ── 4. Fetch latest FX + macro data before training ───────────────────
      # ml/train_models.py NEVER fetches data itself — it only reads
      # whatever's already in Supabase Storage (data/storage_cloud.py's
      # read_price_history). Without this step, training would silently
      # depend on daily_predict.yml having run recently and successfully
      # — a hidden coupling between two workflows that are otherwise
      # now fully independent (see daily_predict.yml's docstring on why
      # they were split apart).
      #
      # FIX: this previously called data.fetcher.run_data_pipeline()
      # directly, which writes to LOCAL SQLITE via
      # data/database.py's write_raw_prices() — a leftover pre-Supabase
      # code path. On a fresh GitHub Actions runner there is no existing
      # SQLite file/schema, so that call failed with "no such table:
      # raw_prices" every run. run_pipeline_cloud.py (the same entry
      # point daily_predict.yml uses, see daily_predict.yml) fetches via
      # data.fetcher.smart_fetch() and writes to SUPABASE, which is this
      # project's actual source of truth post-migration. Calling it here
      # keeps the fetch step consistent with daily_predict.yml's working
      # path instead of the stale direct-SQLite one.
      - name: Fetch latest data before training
        run: python run_pipeline_cloud.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 5. Retrain ML models ───────────────────────────────────────────────
      # No day-of-week gating needed here (unlike the old combined
      # workflow's `date +%u = 6` check) — this workflow's OWN schedule
      # already only fires on Saturdays, and a manual workflow_dispatch
      # of THIS workflow is an explicit "retrain now" request that
      # should always retrain regardless of what day it happens to be.
      - name: Retrain ML models
        run: python ml/train_models.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 6. Commit updated models back to repo ─────────────────────────────
      - name: Commit updated models
        run: |
          git config user.name  "Eagle Logic Bot"
          git config user.email "bot@eaglelogic.com"
          if compgen -G "models/*.pkl" > /dev/null; then
            git add models/*.pkl
            git diff --staged --quiet || git commit -m "chore: retrain models $(date +%Y-%m-%d)"
            git push
          else
            echo "No .pkl models found — skipping commit (training didn't produce models this run, e.g. not enough price history yet)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
