name: Eagle Logic — Daily Predict

on:
  schedule:
    # Daily candles (fetch_interval: "1d"), so the pipeline needs to
    # run every day. 03:00 UTC daily (04:00 UTC+1) — the standard
    # forex daily candle closes at 17:00 ET (22:00 UTC in EST, 21:00
    # UTC in EDT, per the widely-followed 5pm ET convention yfinance
    # itself uses), so this gives a ~6 hour buffer after that close
    # for yfinance's backend to finalize and publish the candle.
    # Chosen deliberately at this (rather than a later) time so the
    # run happens while the user is awake (UTC+1) and can catch/review
    # it directly, rather than discovering results only later in the
    # day.
    - cron: '0 3 * * *'
  # Allow manual trigger from GitHub Actions UI — split into its own
  # workflow (separate from model training, see train_models.yml) per
  # project decision: a manual "give me fresh predictions now" trigger
  # should never risk also retraining the models, which was possible
  # when both lived in one workflow file (a manual dispatch would run
  # BOTH the pipeline AND the training step, since the old retrain
  # condition treated every workflow_dispatch as "retrain now"
  # regardless of why the person actually triggered it).
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements_cloud.txt"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_cloud.txt

      # ── 4. Run daily fetch + predict pipeline ─────────────────────────────
      # This is fetch + indicator engines + prediction ONLY. Model
      # training never happens here — see train_models.yml, a fully
      # separate workflow on its own weekly schedule.
      - name: Run Eagle Logic pipeline
        run: python run_pipeline_cloud.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
