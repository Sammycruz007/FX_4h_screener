name: Eagle Logic — Daily Predict

on:
  schedule:
    # Daily candles (fetch_interval: "1d"), so the pipeline needs to
    
    - cron: '50 12 * * *' # Runs at 1:50 UTC +1
  # Allow manual trigger from GitHub Actions UI — split into its own
  # workflow (separate from model training, see train_models.yml) per
  #triggered it).
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements_cloud.txt"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_cloud.txt

      # ── 4. Run daily fetch + predict pipeline ─────────────────────────────
      # This is fetch + indicator engines + prediction ONLY. Model
      # training never happens here — see train_models.yml, a fully
      # separate workflow on its own weekly schedule.
      - name: Run Eagle Logic pipeline
        run: python run_pipeline_cloud.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
