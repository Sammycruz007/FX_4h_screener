database:
  path: data/fx_scanner.db

storage:
  # Supabase Storage (Parquet snapshots, see data/storage_cloud.py) —
  # NOT the same as `database.path` above, which is local SQLite.
  # Consolidation runs every pipeline execution: reads all accumulated
  # snapshot chunks, dedupes on (pair, datetime), trims anything older
  # than retention_days, writes one fresh consolidated file, deletes
  # every old chunk. Bounds both total Storage bytes AND object count
  # (Supabase free tier caps both) without ever losing in-window data
  # free-tier 1GB cap even before accounting for Parquet compression.
  retention_days: 2600

fetcher:
  batch_size: 25
  max_workers: 7
  retry_attempts: 3
  retry_delay_seconds: 5
  # Weekly candles (fetch_interval: "1wk") have no yfinance history cap,
  # unlike intraday intervals. 9125 days (~25 years) is a deliberate
  # deep-history pull for this project, not a leftover intraday-safety value.
  historical_days: 2300
  incremental_days: 5       # buffer for weekend/holiday gaps
  fetch_interval: "1d"       # what we actually pull from yfinance
  

logging:
  backup_count: 5
  level: INFO
  log_dir: logs
  max_file_size_mb: 10

ml:
  high_probability_threshold: 0.65
  # Locked: 3 daily candles ahead. Moved from 2 weekly candles as part
  # of the directional-label redesign (see FX_Directional_Model_Redesign
  # spec) — the label is no longer a plain close(t+H) > close(t) check,
  # see min_move_atr_multiple / min_confirming_candles below for the
  # rest of the new label definition.
  label_forward_periods: 3
  # New label definition (redesign spec):
  #   BUY : close(t+H) - close(t) >=  min_move_atr_multiple * atr_fast[t],
  #         AND at least min_confirming_candles of the H candles after t
  #         close bullish.
  #   SELL: close(t+H) - close(t) <= -min_move_atr_multiple * atr_fast[t],
  #         AND at least min_confirming_candles of the H candles after t
  #         close bearish.
  #   Otherwise: discard (no label) — replaces the old unconditional
  #   close(t+H) > close(t) label, which counted small, choppy net moves
  #   as a full BUY/SELL even when price reversed mid-window.
  min_move_atr_multiple: 0.8
  min_confirming_candles: 2
  min_training_samples: 50
  model_retrain_days: 7
  # Backfill every day, no skipping.
  backfill_stride: 1

execution_filter:
  # Post-model, pre-write confirmation gate (see engines/linreg.py and
  # run_pipeline_cloud.py). When Stage 1's daily model emits a BUY or
  # SELL for a pair, a fresh month of 5-minute intraday closes for that
  # SAME pair is fetched in memory, a LinReg line is fit over the most
  # recent linreg_period of them, and the signal only survives if the
  # slope agrees with the model's direction (BUY needs an up-slope,
  # SELL needs a down-slope). A disagreeing signal is dropped entirely
  # — never written to Supabase, never shown on the dashboard.
  fetch_interval: "5m"
  # ~1 month of 5-min bars, fetched fresh and never persisted. This is
  # headroom for the fit below, not itself the regression window — see
  # linreg_period.
  fetch_days: 30
  # Number of most-recent 5-min closes actually used to fit the LinReg
  # line/slope.
  linreg_period: 1600

scheduler:
  # 
  run_times:
  - "00:00"
  
  timezone: "UTC"


# Fixed 28-pair universe — all unique combinations of the 8 major
# currencies, standard FX quoting convention (base/quote order matches
# m. yfinance ticker format: "EURUSD=X".
universe:
  pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCAD
  - USDCHF
  - AUDUSD
  - NZDUSD
  - EURGBP
  - EURJPY
  - EURCHF
  - EURAUD
  - EURNZD
  - EURCAD
  - GBPJPY
  - GBPCHF
  - GBPAUD
  - GBPNZD
  - GBPCAD
  - AUDJPY
  - AUDCHF
  - AUDNZD
  - AUDCAD
  - NZDJPY
  - NZDCHF
  - NZDCAD
  - CADJPY
  - CADCHF
  - CHFJPY
  currencies:               # the 8 majors CSI is computed for
  - USD
  - EUR
  - GBP
  - JPY
  - AUD
  - NZD
  - CAD
  - CHF
  # Final basket assignments — verified: all 28 pairs covered exactly
  # once, no typos, no gaps, no duplicates.
  baskets:
    usd:
    - EURUSD
    - GBPUSD
    - AUDUSD
    - NZDUSD
    cad:
    - AUDCAD
    - EURCAD
    - GBPCAD
    - NZDCAD
    - USDCAD
    chf:
    - AUDCHF
    - EURCHF
    - GBPCHF
    - NZDCHF
    - CADCHF
    - USDCHF
    jpy:
    - AUDJPY
    - EURJPY
    - GBPJPY
    - NZDJPY
    - CADJPY
    - CHFJPY
    - USDJPY
    crosses:
    - EURAUD
    - GBPAUD
    - EURNZD
    - GBPNZD
    - EURGBP
    - AUDNZD

adx:
  period: 14   # Wilder's standard default — timeframe-invariant convention

bollinger:
  # Classic 20/2 baseline — the widely-used standard that generalizes
  # well across timeframes, and matches the 20-weekly-candle lookback
  # already used elsewhere in this config (see csi.lookback_period).
  period: 20
  num_std: 2

momentum:
  # Rate-of-change over 10 weekly candles (~1 quarter) — a standard
  # swing-timeframe momentum lookback, long enough to filter noise
  # while staying responsive within the 2-week label horizon.
  roc_period: 10

csi:
  # Currency Strength Index — replaces Market Pulse (SPY/QQQ/DIA) and
  # the sector-ETF-based Relative Strength from the stock projects.
  # RS feature itself = CSI_base - CSI_quote for a given pair (e.g.
  # EURUSD's RS = CSI_EUR - CSI_USD), computed in engines/csi.py.
  # Lookback: 20 weekly candles for the rolling return each currency's
  # strength is averaged from.
  lookback_period: 20
  # csi_diff_zscore — normalises csi_rs (CSI_base - CSI_quote) against
  # its OWN rolling history, so a pair-specific RS gap is comparable
  # across all 28 pairs regardless of each pair's typical RS-gap
  
  zscore_window: 24
  # csi_diff_roc — momentum/exhaustion on the RS gap itself: is it
  # accelerating or rolling over? Differenced over 5 weekly candles —
  # short enough to catch a genuine turn without being pure
  # single-candle noise.
  roc_lag: 5

atr:
  # Two ATR periods, per your request — ATR_14/ATR_50 as a volatility-
  # regime feature (ratio >1 = expanding vol, <1 = compression/squeeze).
  # Also the basis for normalizing every distance-based feature (band
  # width, etc.) — critical for FX specifically, since
  # price LEVEL isn't a meaningful unit here the way it loosely is for
  # stocks (JPY pairs quote in 2 decimals, others in 4-5).
  fast_period: 14
  slow_period: 50

candlestick:
  # Hammer / Shooting Star detection — hand-crafted interaction with
  extreme_sd_threshold: 1.0

rsi:
  period: 14   # Wilder's standard default — timeframe-invariant convention

macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9

trend:
  # SMA periods for price-vs-trend position features (price_vs_sma20,
  # price_vs_sma50, sma_cross), matching the EURUSD reference project.
  sma_fast: 20
  sma_slow: 50
  # Extra SMA/EMA from the reference project's add_trend_features —
  # sma_10 feeds sma_cross (sma_10 > sma_20), ema_10 is its own
  # feature. Same window lengths as the reference (10), carried over
  # 1:1 in candle-count (weekly candles instead of daily), per project
  # decision: same settings, weeks instead of days.
  sma_short: 10
  ema_short: 10

stochastic:
  # Stochastic Oscillator (%K, %D) — 2nd-most-important single feature
  # in the EURUSD reference project's importance ranking (stoch_k),
  # entirely missing from this project until now. Same window (14) as
  # the reference, carried over 1:1 in candle-count.
  period: 14

lag_features:
  # Simple N-candle-ago returns (distinct from price_roc, which uses a
  # single 10-candle lookback) — return_lag_5 ranked in the reference
  # project's top 15. Same lag set as the reference (2, 3, 5, 10),
  # carried over 1:1 in candle-count (weekly candles instead of daily).
  lags: [2, 3, 5, 10]
  # Rolling return-volatility windows feeding vol_expanding (replaces
  # the atr_fast/atr_slow-based version with the reference project's
  # own return-stdev-based definition, kept alongside atr_ratio rather
  # than instead of it, since atr_ratio already existed here and both
  # measure the same underlying "is volatility expanding" concept from
  # slightly different angles).
  volatility_short: 10
  volatility_long: 20

macro:
  # External, non-price-derived drivers — the EURUSD-only project's
  # biggest edge came from these (DXY/10Y yield/gold): in its feature-
  # importance ranking, dxy_return_1d/dxy_rsi/dxy_return_5d/
  # gold_return_1d occupied 4 of the top 5 spots, well above every
  # single technical indicator. Mapped per basket to each quote
  # currency's real fundamental driver, not just reused generically
  # across all baskets.
  #
  # WINDOW LENGTHS: same candle-count as the reference project (1 and
  # 5), carried over from daily to weekly bars per project decision —
  # "same settings, weeks instead of days" — so return_1d -> return_1wk
  # (1 weekly candle) and return_5d -> return_5wk (5 weekly candles).
  # rsi_period also matches the reference project's macro RSI (10),
  # which differs from this project's own price-feature RSI (14,
  # Wilder's standard) — the reference project used a shorter,
  # more-reactive window specifically for its macro indicators.
  return_short_lag: 1
  return_long_lag: 5
  rsi_period: 10
  #
  # yfinance tickers:
  #   DXY    -> "DX-Y.NYB"  (US Dollar Index)
  #   GOLD   -> "GC=F"      (Gold futures)
  #   US10Y  -> "^TNX"      (US 10-Year Treasury yield)
  #   WTI    -> "CL=F"      (WTI Crude Oil futures — Canada's top export)
  #   VIX    -> "^VIX"      (CBOE Volatility Index — safe-haven/risk-off
  #                          proxy; used for CHF and JPY since no free,
  #                          reliable CHF/JPY-specific yield series
  #                          exists on yfinance, and both currencies'
  #                          moves are driven far more by risk sentiment
  #                          / carry-unwind flows than by their own
  #                          domestic yield)
  drivers:
    DXY:
      yf_ticker: "DX-Y.NYB"
      storage_symbol: "DXY"
    GOLD:
      yf_ticker: "GC=F"
      storage_symbol: "XAUUSD"
    US10Y:
      yf_ticker: "^TNX"
      storage_symbol: "US10Y"
    WTI:
      yf_ticker: "CL=F"
      storage_symbol: "WTI"
    VIX:
      yf_ticker: "^VIX"
      storage_symbol: "VIX"

  # Basket -> which driver(s) get joined into that basket's feature
  # matrix. "crosses" (EUR/GBP/AUD/NZD only, no USD) uses VIX as a
  # general risk-sentiment proxy rather than any single quote-currency
  # driver, since it has no single shared quote currency.
  basket_drivers:
    usd: ["DXY", "GOLD", "US10Y"]
    cad: ["WTI"]
    chf: ["VIX"]
    jpy: ["VIX"]
    crosses: ["VIX"]

session:
  # UTC hour ranges for the session-indicator feature — free to compute
  # from a candle's own timestamp, no new data source needed. Captures
  # that FX behavior differs meaningfully by session (London-NY overlap
  # = highest volatility; Asian session = often quieter/ranging).
  tokyo_open_utc: 0
  tokyo_close_utc: 9
  london_open_utc: 8
  london_close_utc: 17
  new_york_open_utc: 13
  new_york_close_utc: 22
